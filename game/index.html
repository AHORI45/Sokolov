<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Memory Game</title>

<style>
#game {
  display: grid;
  gap: 10px;
  margin-top: 15px;
  justify-content: center;
}

/* Карточка */
.card {
  width: 50px;
  height: 75px;
  perspective: 800px;
  cursor: pointer;
}

/* Внутренний блок */
.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

/* Переворот */
.card.flip .card-inner {
  transform: rotateY(180deg);
}

/* Лица */
.face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border: 1px solid black;
  border-radius: 6px;
}

/* рубашка */
.front {
  background: url("images/back.png") center/cover;
}

/* лицевая сторона */
.back {
  transform: rotateY(180deg);
  background-size: cover;
  background-position: center;
}
</style>
</head>

<body>

<h2>Мемори игра</h2>

<label>Количество пар: </label>
<select id="pairSelect">
  <option value="2">2</option>
  <option value="4" selected>4</option>
  <option value="6">6</option>
  <option value="8">8</option>
  <option value="10">10</option>
</select>

<button id="startBtn">Начать заново</button>

<p id="info">Ходы: 0</p>
<p id="record">Рекорд: —</p>

<div id="game"></div>

<script>
const allImages = [
  'images/img1.png',
  'images/img2.png',
  'images/img3.png',
  'images/img4.png',
  'images/img5.png',
  'images/img6.png',
  'images/img7.png',
  'images/img8.png',
  'images/img9.png',
  'images/img10.png'
];

const game = document.getElementById('game');
const info = document.getElementById('info');
const recordEl = document.getElementById('record');
const startBtn = document.getElementById('startBtn');
const pairSelect = document.getElementById('pairSelect');

/* ---------------- ЗВУКИ ---------------- */
const flipSound = new Audio('sounds/flip.mp3');
const matchSound = new Audio('sounds/match.mp3');

flipSound.volume = 0.3;
matchSound.volume = 0.5;

function playSound(sound) {
  sound.pause();
  sound.currentTime = 0;
  sound.play();
}

function unlockAudio() {
  flipSound.play().catch(() => {});
  flipSound.pause();
  flipSound.currentTime = 0;
}
/* --------------------------------------- */

let first = null;
let second = null;
let lock = false;
let moves = 0;
let matchedPairs = 0;
let maxMoves = 0;

startBtn.addEventListener('click', startGame);
pairSelect.addEventListener('change', updateRecordDisplay);

function getRecord(pairCount) {
  return localStorage.getItem(`memory_record_${pairCount}`) || null;
}

function saveRecord(pairCount, moves) {
  const prev = getRecord(pairCount);
  if (!prev || moves < Number(prev)) {
    localStorage.setItem(`memory_record_${pairCount}`, moves);
  }
}

function updateRecordDisplay() {
  const pairCount = Number(pairSelect.value);
  const rec = getRecord(pairCount);
  recordEl.textContent = rec ? `Рекорд: ${rec}` : 'Рекорд: —';
}

function startGame() {
  unlockAudio();

  game.innerHTML = '';

  const pairCount = Number(pairSelect.value);

  const images = allImages.slice(0, pairCount);
  const cards = [...images, ...images].sort(() => Math.random() - 0.5);

  first = null;
  second = null;
  lock = false;
  moves = 0;
  matchedPairs = 0;
  maxMoves = pairCount * 3;

  info.textContent = `Ходы: 0/${maxMoves}`;
  updateRecordDisplay();

  /* ================================
     🔥 АДАПТИВНАЯ СЕТКА (ИСПРАВЛЕНИЕ)
  ================================= */
  const totalCards = pairCount * 2;
  const cols = Math.ceil(Math.sqrt(totalCards));
  game.style.gridTemplateColumns = `repeat(${cols}, 110px)`;
  /* ================================ */

  cards.forEach(src => {
    const card = document.createElement('div');
    card.className = 'card';

    card.innerHTML = `
      <div class="card-inner">
        <div class="face front"></div>
        <div class="face back" style="background-image:url('${src}')"></div>
      </div>
    `;

    card.dataset.src = src;

    card.addEventListener('click', () => {
      if (lock || card.classList.contains('flip')) return;

      playSound(flipSound);
      card.classList.add('flip');

      if (!first) {
        first = card;
        return;
      }

      second = card;
      lock = true;

      moves++;
      info.textContent = `Ходы: ${moves}/${maxMoves}`;

      if (first.dataset.src === second.dataset.src) {
        playSound(matchSound);

        matchedPairs++;
        reset();
        checkEnd(pairCount);
      } else {
        setTimeout(() => {
          first.classList.remove('flip');
          second.classList.remove('flip');
          reset();
          checkEnd(pairCount);
        }, 800);
      }
    });

    game.appendChild(card);
  });
}

function reset() {
  first = null;
  second = null;
  lock = false;
}

function checkEnd(pairCount) {
  if (matchedPairs === pairCount) {
    saveRecord(pairCount, moves);
    updateRecordDisplay();
    setTimeout(() => alert('🎉 Победа!'), 200);
    lock = true;
  } 
  else if (moves >= maxMoves) {
    setTimeout(() => alert('❌ Проигрыш!'), 200);
    lock = true;
  }
}

updateRecordDisplay();
</script>

</body>
</html>
